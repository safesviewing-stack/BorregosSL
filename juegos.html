<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Oveja · Borregos S.L.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    
    <style>
        :root{color-scheme:dark;--bg:#0c0c0b;--card:rgba(17,17,16,.85);--text:#f3f1ec;--muted:#a7a39b;--yellow:#ffd23f;
            --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
        *{box-sizing:border-box}
        body{margin:0;padding:0;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;touch-action:none}
        #gameCanvas{display:block;width:100vw;height:100vh;background:radial-gradient(120% 90% at 50% 100%,#3a2414 0%,#16110d 45%,#07090c 100%)}
        .back-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));z-index:1000;
            display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--text);
            text-decoration:none;font-size:14px;font-weight:600;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
        .back-btn:hover{background:rgba(255,255,255,.2)}
        .theme-control{display:none}
        .score-display{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));z-index:100;
            background:var(--yellow);color:#111;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
        .game-ui{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;width:min(400px,calc(100% - 32px));max-height:88vh;overflow-y:auto;
            padding:28px 24px 24px;background:var(--card);border-radius:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
        h1{font-weight:800;font-size:clamp(38px,9vw,52px);line-height:.95;letter-spacing:-.04em;margin:0}
        .input-group{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
        .input-group input{padding:13px 16px;font:inherit;font-size:16px;background:rgba(255,255,255,.08);color:var(--text);border:0;border-radius:12px;text-align:center;outline:none}
        .input-group input:focus{box-shadow:0 0 0 2px var(--yellow)}
        .btn-jugar{background:var(--yellow);color:#111;min-height:48px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:999px;cursor:pointer}
        .btn-jugar:hover{background:#ffe07a}
        .leaderboard{margin-top:20px;text-align:left}
        .leaderboard h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--yellow)}
        .leaderboard ul{list-style:none;padding:0;margin:0}
        .leaderboard li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:500}
        .leaderboard li:last-child{border-bottom:none}
        .leaderboard li span.score-val{font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
    </style>
</head>
<body>
    
    <a href="index.html" class="back-btn">← Volver</a>
    <button class="theme-control" id="themeBtn" onclick="toggleTheme()">🌚</button>

    <div id="scoreDisplay" class="score-display">PUNTOS: 0</div>

    <div class="game-ui" id="startScreen">
        <h1 id="mainTitle">Flappy Oveja</h1>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Tu nombre..." maxlength="12" autocomplete="off">
            <button class="btn-jugar" id="startBtn">Jugar</button>
        </div>
        
        <div class="leaderboard">
            <h3>Mejores borregos</h3>
            <ul id="leaderboardList"></ul>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- MODO OSCURO ---
        function aplicarTema() {
            const isDark = localStorage.getItem('borregos_dark_mode') === 'true';
            document.body.classList.toggle('dark-mode', isDark);
            document.getElementById('themeBtn').innerText = isDark ? '🌞' : '🌚';
        }

        function toggleTheme() {
            const isDark = !document.body.classList.contains('dark-mode');
            document.body.classList.toggle('dark-mode', isDark);
            localStorage.setItem('borregos_dark_mode', isDark);
            document.getElementById('themeBtn').innerText = isDark ? '🌞' : '🌚';
        }
        aplicarTema();

        // --- REFERENCIAS Y VARIABLES PRINCIPALES ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('startScreen');
        const scoreUI = document.getElementById('scoreDisplay');
        const pName = document.getElementById('playerName');
        const btn = document.getElementById('startBtn');
        const list = document.getElementById('leaderboardList');
        
        let width, height;
        let frames = 0, score = 0, lastTime = 0;
        let gameActive = false, player = "";
        
        const img = new Image(); 
        img.src = 'assets/ovejita.webp';

        const getScale = () => Math.min(width / 400, 1.5);
        const getBirdSize = () => Math.max(30, width * 0.08);

        function resize() {
            width = window.innerWidth; 
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = width * dpr; 
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`; 
            canvas.style.height = `${height}px`;
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize); 
        resize();

        // --- ENTIDAD: OVEJA ---
        const bird = {
            init() { 
                this.s = getBirdSize(); 
                this.x = width * 0.15; 
                this.y = height / 2; 
                this.g = height * 0.0008; 
                this.l = -height * 0.011; 
                this.v = 0; 
            },
            draw() {
                if (img.complete) {
                    ctx.save(); 
                    ctx.translate(this.x + this.s, 0); 
                    ctx.scale(-1, 1);
                    ctx.drawImage(img, -this.s - (this.s * 0.1), this.y - (this.s * 0.1), this.s * 1.2, this.s * 1.2); 
                    ctx.restore();
                } else { 
                    ctx.fillStyle = "white"; 
                    ctx.fillRect(this.x, this.y, this.s, this.s); 
                }
            },
            update() {
                this.v += this.g; 
                this.y += this.v;
                
                if (this.y + this.s >= height) { 
                    this.y = height - this.s; 
                    die(); 
                }
                if (this.y <= 0) { 
                    this.y = 0; 
                    this.v = 0; 
                }
            },
            jump() { this.v = this.l; }
        };

        // --- ENTIDAD: TUBERÍAS ---
        const pipes = {
            arr: [], 
            
            init() { 
                this.arr = []; 
                this.w = Math.max(50, width * 0.12); 
                this.gap = getBirdSize() * 4.5; 
                this.dx = width * 0.007; 
            },
            draw() {
                this.arr.forEach(p => {
                    ctx.fillStyle = "#b8913f"; 
                    ctx.strokeStyle = "#3a2a12"; 
                    ctx.lineWidth = 4; 
                    
                    // Tubo superior
                    ctx.fillRect(p.x, 0, this.w, p.top); 
                    ctx.strokeRect(p.x, 0, this.w, p.top);
                    
                    // Tubo inferior
                    ctx.fillRect(p.x, height - p.bot, this.w, p.bot);
                    ctx.strokeRect(p.x, height - p.bot, this.w, p.bot);
                });
            },
            update() {
                // Generar nuevas tuberías
                if (frames % Math.floor(120 / getScale()) === 0) { 
                    const top = Math.random() * (height - this.gap - 100) + 50;
                    this.arr.push({ x: width, top, bot: height - (top + this.gap), passed: false });
                }
                
                // Mover tuberías y colisiones
                for (let i = 0; i < this.arr.length; i++) {
                    const p = this.arr[i]; 
                    p.x -= this.dx;
                    
                    // Colisión
                    const hitX = bird.x < p.x + this.w && bird.x + bird.s > p.x;
                    const hitY = bird.y < p.top || bird.y + bird.s > height - p.bot;
                    if (hitX && hitY) die(); 
                    
                    // Puntuar
                    if (!p.passed && p.x + this.w < bird.x) { 
                        score++; 
                        scoreUI.innerText = `PUNTOS: ${score}`; 
                        p.passed = true; 
                    } 
                    
                    // Eliminar las que salen de la pantalla
                    if (p.x + this.w < 0) { 
                        this.arr.shift(); 
                        i--; 
                    }
                }
            }
        };

        // --- LÓGICA DE JUEGO ---
        function renderLeaderboard() {
            const data = JSON.parse(localStorage.getItem('flappy_borrego_scores')) || [];
            
            if (data.length > 0) {
                list.innerHTML = data.map((e, i) => 
                    `<li><span>${i + 1}. ${e.name}</span><span class="score-val">${e.score}</span></li>`
                ).join('');
            } else {
                list.innerHTML = "<li>Aún no hay puntuaciones.</li>";
            }
        }
        renderLeaderboard();

        function die() {
            if (!gameActive) return; 
            gameActive = false;
            
            const board = JSON.parse(localStorage.getItem('flappy_borrego_scores')) || [];
            board.push({ name: player || "Anónimo", score });
            
            // Guardar el top 10
            localStorage.setItem(
                'flappy_borrego_scores', 
                JSON.stringify(board.sort((a, b) => b.score - a.score).slice(0, 10))
            );
            
            renderLeaderboard();
            document.getElementById("mainTitle").innerText = "Te has estampado.";
            ui.style.display = 'block';
        }

        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (!lastTime) lastTime = timestamp;
            
            const dt = timestamp - lastTime;
            const targetFPS = 1000 / 60;
            
            if (dt >= targetFPS) {
                lastTime = timestamp - (dt % targetFPS);
                ctx.clearRect(0, 0, width, height);
                
                if (gameActive) { 
                    bird.update(); 
                    pipes.update(); 
                    frames++; 
                }
                
                bird.draw(); 
                pipes.draw();
            }
        }

        // --- CONTROLES Y EVENTOS ---
        btn.addEventListener('click', () => {
            player = pName.value.trim();
            if (!player) return alert("¡Pon tu nombre para jugar!");
            
            bird.init(); 
            pipes.init();
            
            gameActive = true; 
            ui.style.display = 'none';
            score = 0; 
            frames = 0;
            scoreUI.innerText = "PUNTOS: 0"; 
            
            bird.jump();
        });

        const handleInput = (e) => { 
            if (!e.target.closest('.back-btn, .theme-control, .game-ui') && gameActive) { 
                e.preventDefault(); 
                bird.jump(); 
            }
        };
        
        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('mousedown', handleInput);

        // --- INICIAR ---
        bird.init(); 
        pipes.init(); 
        requestAnimationFrame(loop);
    </script>
</body>
</html>
