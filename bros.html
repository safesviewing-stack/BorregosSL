<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Borrego Bros · Borregos S.L.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{color-scheme:dark;--bg:#0c0c0b;--card:rgba(17,17,16,.88);--text:#f3f1ec;--muted:#a7a39b;--yellow:#ffd23f;--line:rgba(255,255,255,.08);
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0c0c0b}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.12);
  color:var(--text);font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill:hover{background:rgba(255,255,255,.2)}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));z-index:20}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));z-index:20;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
  pointer-events:none;max-width:calc(100% - 130px)}
.hud span{background:rgba(17,17,16,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hud span b{color:var(--yellow);font-weight:700}
.hud .pts{background:var(--yellow);color:#111}
.panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;width:min(420px,calc(100% - 32px));max-height:calc(100% - 96px);overflow-y:auto;
  padding:28px 24px 22px;background:var(--card);border-radius:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.5);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.panel.hide{opacity:0;transform:translate(-50%,-46%);pointer-events:none}
.kicker{font-size:13px;font-weight:600;color:var(--yellow)}
h1{font-weight:800;font-size:clamp(40px,10vw,56px);line-height:.92;letter-spacing:-.045em;margin:6px 0 0;font-stretch:108%}
.lead{margin:12px auto 0;color:var(--muted);font-size:15px;line-height:1.45;max-width:30ch}
.result{margin:14px 0 0;font-size:16px;font-weight:600;line-height:1.4}
.result b{color:var(--yellow)}
.form{margin-top:18px;display:grid;gap:10px}
.form input{padding:13px 16px;font:inherit;font-size:16px;background:rgba(255,255,255,.08);color:var(--text);border:0;border-radius:12px;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
.form input:focus{box-shadow:0 0 0 2px var(--yellow)}
.form input.bad{box-shadow:0 0 0 2px #e5484d;animation:nope .3s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.play{background:var(--yellow);color:#111;min-height:50px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:999px;cursor:pointer}
.play:hover{background:#ffe07a}
.opts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.opts .pill{min-height:34px;font-size:13px;padding:0 12px}
.keys{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.keys kbd{font:inherit;font-weight:700;color:var(--text);background:rgba(255,255,255,.1);border-radius:6px;padding:1px 6px}
.board{margin-top:18px;text-align:left}
.board h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--yellow)}
.board ol{list-style:none;padding:0;margin:0}
.board li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:500}
.board li:last-child{border-bottom:0}
.board li span:last-child{font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.board li small{color:var(--muted);font-weight:500;margin-left:6px}
.touch{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px))}
.touch.on{display:flex}
.touch .pad{display:flex;gap:14px;pointer-events:auto}
.touch button{width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:var(--text);font:inherit;font-size:24px;font-weight:800;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:none;pointer-events:auto;display:grid;place-items:center}
.touch button.down{background:rgba(255,210,63,.5);color:#111}
.touch .jump{width:84px;height:84px;font-size:15px;background:rgba(255,210,63,.88);color:#111}
.touch .jump.down{background:#fff0b3}
.touch svg{width:26px;height:26px}
@media (max-width:520px){.hud .time{display:none}}
@media (max-width:420px){.hud{gap:4px;max-width:calc(100% - 112px)}.hud span{padding:7px 9px;font-size:12px}}
@media (max-height:460px){.panel{padding:18px 20px 16px}.board{display:none}h1{font-size:40px}.touch button{width:58px;height:58px}.touch .jump{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<a href="index.html" class="pill back">← Volver</a>
<div class="hud" id="hud" aria-live="polite">
  <span>Nivel <b id="hLevel">1</b>/3</span><span>Queso <b id="hCheese">0</b></span><span>Vidas <b id="hLives">3</b></span><span class="time" id="hTime">0:00</span><span class="pts" id="hScore">0 pts</span>
</div>

<div class="panel" id="panel" role="dialog" aria-labelledby="pTitle">
  <span class="kicker" id="pKicker">Borregos S.L. presenta</span>
  <h1 id="pTitle">Borrego Bros</h1>
  <p class="lead" id="pLead">Tres salas y tres vidas. Cruza la sede, cómete el queso, pisa a los lobos y llega al trono.</p>
  <p class="result" id="pResult" hidden></p>
  <div class="form">
    <input type="text" id="pName" placeholder="Tu nombre..." maxlength="12" autocomplete="off" aria-label="Tu nombre">
    <button class="play" id="pPlay">Jugar</button>
    <div class="opts"><button class="pill" id="pSound" aria-pressed="true">Sonido: sí</button></div>
  </div>
  <p class="keys" id="pKeys"><kbd>←</kbd> <kbd>→</kbd> para moverte · <kbd>Espacio</kbd> para saltar.<br>Salta encima de los lobos y las multas. Los petardos, ni tocarlos.</p>
  <div class="board"><h3>Mejores borregos</h3><ol id="pBoard"></ol></div>
</div>

<div class="touch" id="touch" aria-hidden="true">
  <div class="pad">
    <button data-k="left" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button data-k="right" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="pad"><button class="jump" data-k="jump" aria-label="Saltar">Saltar</button></div>
</div>

<canvas id="game"></canvas>

<script>
(function () {
'use strict';
/* =========================================================

   ========================================================= */
const LEVELS = [{"name": "La entrada", "map": ["............................................................................................................................................................................", "..........................................................................................................................................................................xx", "..........................................................................................................................................................................xx", ".............................................................................................c...............................................m............................xx", ".............................................................................................c................m...........................................................xx", "...................................................................................cc..w.....c..............................................................ccc...........xx", ".........................................................c........................========................................................ccc.............................xx", ".......cc.......................c...............m..............................................................cc...........cc...........=======...........xxxx...........xx", "......c..c...c........................cccc...............x......................xx.........................cc..xx.........................................xxxxx......D....xx", "................................x..cc======.............xx...........cc........xxx....................cc...xx...........................x.............c..xxxxxx...........xx", "..P..........x...........w.....xx..................^...xxx...w..w.L...........xxxx...........z...w..j..................L....^^...j..w..xx..........^....xxxxxxx..w........xx", "##################..##################....###############################...#############################............########################...############################", "##################..##################....###############################...#############################............########################...############################"], "movers": []}, {"name": "La galería", "map": ["..........................................................................................................................................................................................................", "........................................................................................................................................................................................................xx", "..............................................................................................................cc.cc.....................................................................................xx", ".............................................................................................................=======....................................................................................xx", "..................................................................................cc....cc.................................m............................................................................xx", ".....................................................................................w..................m.........................................................................m.....................xx", "............................m...................................................xxxxxxxxxxx.......m...........................c.............................................cc..........................xx", "...................................c.........c..c................cccc...........xxxxxxxxxxx............................c........................cc......................................................xx", "................................................................======..........xxxxxxxxxxx..................................................c................c.............xx....................D.....xx", ".......ccc.................................................x....................xxxxxxxxxxx...................................................................x............xxxx.........................xx", "..P.....................w.....w....^...................L..xx..j...^^....w.......xxxxxxxxxxx.........j.......j...z.....................L...^..x..^^...w..w.............j...xxxxxx....w...j..^............xx", "###############...#######################............#######################....####################################................########################.....#########################################", "###############...#######################............#######################....####################################................########################.....#########################################"], "movers": [{"x": 42, "y": 9, "w": 3, "axis": "x", "range": 6, "speed": 2.2, "ph": 0.0}, {"x": 78, "y": 10, "w": 2, "axis": "y", "range": 4.4, "speed": 1.6, "ph": 0.0}, {"x": 117, "y": 9, "w": 3, "axis": "x", "range": 4, "speed": 2.4, "ph": 0.0}, {"x": 124, "y": 8, "w": 3, "axis": "x", "range": 4, "speed": 2.0, "ph": 1.6}]}, {"name": "El trono", "map": ["..............................................................................................................................................................................................................................", "............................................................................................................................................................................................................................xx", "..................................................................................c.c.c.c.c.................................................................................................................................xx", "................................................................................=============...............................................................................................................................xx", "......................................................................c.....................................m...............................................................................................................xx", "..........................m........c....c..........................c.w..............................................m............................c.w.c..........m..........................................ccc..............xx", "......................m...........................................======........................m...............c.............................xx=======.....m.......m.......................................................xx", "....................c...c...c...........................................................................c..............c.....................xxx...................................................cc......xxx..............xx", ".................................................................x..........................................................................xxxx..............c...c...c...................................xxxx......K.......xx", "......cc.........................................................x.........................................................................xxxxx.........................................................xxxxx..............xx", "..P.................^...^...^...................L...j...j...j...xx............z...^^..^^..w...w.............................L.....j...j...xxxxxx..........^...w.......w..................w..j..j...^^...xxxxxx..............xx", "#############....##############................########################....##########################......................#####################.......######################.....############################################", "#############....##############................########################....##########################......................#####################.......######################.....############################################"], "movers": [{"x": 32, "y": 10, "w": 2, "axis": "y", "range": 4, "speed": 1.8, "ph": 0.0}, {"x": 37, "y": 10, "w": 2, "axis": "y", "range": 4, "speed": 1.8, "ph": 3.14}, {"x": 42, "y": 10, "w": 2, "axis": "y", "range": 4, "speed": 1.8, "ph": 0.0}, {"x": 102, "y": 9, "w": 3, "axis": "x", "range": 4, "speed": 2.6, "ph": 0.0}, {"x": 110, "y": 8, "w": 3, "axis": "x", "range": 4, "speed": 2.9, "ph": 1.2}, {"x": 117, "y": 9, "w": 3, "axis": "x", "range": 4, "speed": 2.6, "ph": 2.4}, {"x": 174, "y": 10, "w": 2, "axis": "y", "range": 3, "speed": 1.6, "ph": 0.0}]}];
const ROWS = 13;
let COLS = LEVELS[0].map[0].length;
// each room is harder: faster wolves, shorter par time for the time bonus, its own look
const LVCFG = [
  { wolf: 2.4, par: 110, sky: ['#07080a', '#14110e', '#291b10'], wall: 'windows' },
  { wolf: 2.9, par: 150, sky: ['#07080a', '#15110d', '#26190f'], wall: 'portraits' },
  { wolf: 3.4, par: 190, sky: ['#0b0606', '#1d0d0b', '#2f140f'], wall: 'drapes' },
];
const PHYS = { G: 42, JUMP: 16.2, MAXV: 7.2, ACC_G: 70, ACC_A: 46, DEC: 62, BOUNCE: 25.5, STOMP: 11.5, STOMP_HI: 15.5 };
const STEP = 1 / 120;

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const panel = $('panel'), pName = $('pName'), pPlay = $('pPlay'), pBoard = $('pBoard');
const touchUI = $('touch');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
pName.value = store.get('borregos_player_name', '');

/* ---------- sprites ---------- */
const sheepImg = new Image(); sheepImg.src = 'assets/ovejita.webp';
const HERD = ['samu', 'david', 'frank', 'jose', 'luis', 'leandro', 'adrian', 'ruben', 'alejandro', 'miguel'].map((k) => { const i = new Image(); i.decoding = 'async'; i.src = 'assets/retratos/' + k + '.jpg'; return i; });

/* ---------- sizing ---------- */
let W = 0, H = 0, DPR = 1, TS = 48, reserve = 0, isTouch = false;
function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  reserve = isTouch && H > W ? 150 : 0;
  TS = Math.max(22, Math.min(80, Math.min(H / 11, W / (H > W ? 8 : 9.5))));
  buildSprites(); buildBackdrop();
  if (game) snapCamera();
}
addEventListener('resize', resize);

/* ---------- pre-rendered tiles ---------- */
const spr = {};
function off(w, h, draw) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR); draw(x, w, h); return c;
}
function buildSprites() {
  const s = TS;
  // floor surface: the hall's black-and-cream marble seen edge on, a gilded fillet, dark skirting below
  for (const parity of [0, 1]) spr['top' + parity] = off(s, s, (x) => {
    x.fillStyle = '#1d1510'; x.fillRect(0, 0, s, s);
    const h = s * 0.2;
    x.fillStyle = parity ? '#e8dfcc' : '#151312'; x.fillRect(0, 0, s / 2, h);
    x.fillStyle = parity ? '#151312' : '#e8dfcc'; x.fillRect(s / 2, 0, s / 2, h);
    x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(0, 0, s, Math.max(1, s * 0.03));
    x.fillStyle = '#c89f52'; x.fillRect(0, h, s, Math.max(1.5, s * 0.05));
    x.fillStyle = '#2a1d14'; x.fillRect(0, h + s * 0.05, s, s * 0.3);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(0, h + s * 0.35, s, Math.max(1, s * 0.03));
    x.fillStyle = 'rgba(255,255,255,.04)'; x.fillRect(s * 0.5, h + s * 0.08, Math.max(1, s * 0.02), s * 0.25);
  });
  spr.fill = off(s, s, (x) => {
    x.fillStyle = '#140f0b'; x.fillRect(0, 0, s, s);
    x.fillStyle = 'rgba(255,255,255,.035)';
    x.fillRect(0, s * 0.5, s, Math.max(1, s * 0.03)); x.fillRect(s * 0.25, 0, Math.max(1, s * 0.03), s * 0.5); x.fillRect(s * 0.75, s * 0.5, Math.max(1, s * 0.03), s * 0.5);
  });
  spr.crate = off(s, s, (x) => {
    const r = s * 0.08;
    x.fillStyle = '#3e2816'; roundRect(x, 0, 0, s, s, r); x.fill();
    x.fillStyle = '#7a5232'; roundRect(x, s * 0.07, s * 0.07, s * 0.86, s * 0.86, r * 0.6); x.fill();
    x.strokeStyle = '#4e331e'; x.lineWidth = s * 0.09; x.lineCap = 'round';
    x.beginPath(); x.moveTo(s * 0.16, s * 0.84); x.lineTo(s * 0.84, s * 0.16); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(s * 0.07, s * 0.07, s * 0.86, Math.max(1, s * 0.04));
    x.fillStyle = '#c89f52';
    for (const [cx, cy] of [[0.15, 0.15], [0.85, 0.15], [0.15, 0.85], [0.85, 0.85]]) { x.beginPath(); x.arc(s * cx, s * cy, s * 0.045, 0, 7); x.fill(); }
  });
  spr.plat = off(s, s * 0.5, (x) => {
    x.fillStyle = '#5a3b22'; x.fillRect(0, s * 0.04, s, s * 0.22);
    x.fillStyle = '#c89f52'; x.fillRect(0, 0, s, Math.max(1.5, s * 0.05));
    x.fillStyle = 'rgba(0,0,0,.3)'; x.fillRect(0, s * 0.24, s, Math.max(1, s * 0.03));
    x.fillStyle = '#3e2816'; x.beginPath(); x.moveTo(s * 0.3, s * 0.26); x.lineTo(s * 0.7, s * 0.26); x.lineTo(s * 0.5, s * 0.44); x.fill();
  });
}
function roundRect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

/* ---------- backdrop: the hall's walls, frames and chandeliers ---------- */
let skyGrad = null;
function buildBackdrop() {
  const sky = LVCFG[game ? game.level : 0].sky;
  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, sky[0]); skyGrad.addColorStop(0.55, sky[1]); skyGrad.addColorStop(1, sky[2]);
}
function drawBackdrop() {
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);
  const floorY = wy(11);
  // far wall: pilasters with picture frames between them (slow parallax)
  const P = 0.35, span = 6 * TS, sh = cam.x * TS * P, base = Math.floor(sh / span), ox = base * span - sh;
  for (let j = -1, x = ox - span; x < W + span; j++, x += span) {
    const id = ((base + j) % HERD.length + HERD.length) % HERD.length;
    const top = floorY - 9.5 * TS;
    ctx.fillStyle = '#100c09'; ctx.fillRect(x, top, TS * 0.55, floorY - top);
    ctx.fillStyle = 'rgba(200,159,82,.35)'; ctx.fillRect(x - TS * 0.08, top + TS * 0.4, TS * 0.71, Math.max(1, TS * 0.06));

    if (style === 'drapes') { drawDrapes(x, span, top, floorY, fx + fw / 2); continue; }

    ctx.fillStyle = '#6e5527'; ctx.fillRect(fx, fy, fw, fh);
    const ix = fx + TS * 0.14, iy = fy + TS * 0.14, iw = fw - TS * 0.28, ih = fh - TS * 0.28, im = HERD[id];
    ctx.fillStyle = '#1b1612'; ctx.fillRect(ix, iy, iw, ih);
    if (im.complete && im.naturalWidth) {                 // cover-crop the portrait into the frame
      const r = iw / ih, sw = Math.min(im.naturalWidth, im.naturalHeight * r), shh = sw / r;

    }

    ctx.fillStyle = '#b89a6a'; ctx.fillRect(fx + fw * 0.25, fy - TS * 0.32, fw * 0.5, Math.max(1.5, TS * 0.05));
  }

  const P2 = 0.6, span2 = 15 * TS, ox2 = -(cam.x * TS * P2) % span2;
  for (let x = ox2 - span2; x < W + span2; x += span2) {
    const cx = x + span2 * 0.5, cy = floorY - 8.6 * TS;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, TS * 3.2);
    g.addColorStop(0, 'rgba(255,190,110,.28)'); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - TS * 3.2, cy - TS * 3.2, TS * 6.4, TS * 6.4);
    ctx.strokeStyle = 'rgba(200,159,82,.6)'; ctx.lineWidth = Math.max(1, TS * 0.04);
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, cy - TS * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, TS * 1.1, TS * 0.28, 0, 0, Math.PI); ctx.stroke();

/* ---------- HUD & board ---------- */
const fmtN = (n) => n.toLocaleString('es-ES');

const hud = { c: -1, l: -1, s: -1, t: -1, v: -1 };
function updateHUD() {

  if (hud.c !== g.cheeseN) { hud.c = g.cheeseN; $('hCheese').textContent = g.cheeseN; }
  if (hud.l !== g.lives) { hud.l = g.lives; $('hLives').textContent = Math.max(0, g.lives); }
  if (hud.s !== g.score) { hud.s = g.score; $('hScore').textContent = fmtN(g.score) + ' pts'; }

renderBoard();

/* ---------- camera ---------- */
function camTarget() {

}

  ctx.globalAlpha = 1;
}
function inView(x, w) { return x + w > cam.x - 1 && x < cam.x + W / TS + 1; }
function draw() {
  drawBackdrop();
  if (!game) return;
  const t = game.t;
  drawTiles();
  for (const L of game.checks) if (inView(L.x, 1)) drawCheck(L, t);
  if (game.throne && inView(game.throne.x, 2)) drawThrone(game.throne, t);
  if (game.door && inView(game.door.x, 2)) drawDoor(game.door, t);
  for (const m of game.movers) if (inView(m.x, m.w)) drawMover(m);
  for (const f of game.fire) if (inView(f.x, 1)) drawFire(f, t);
  for (const c of game.cheese) if (inView(c.x, 1)) drawCheese(c, t);
  for (const w of game.wolves) if ((w.alive || w.squash < 0.7) && inView(w.x, 1)) drawWolf(w, t);
  for (const m of game.tickets) if ((m.alive || m.squash < 0.6) && inView(m.x, 1)) drawTicket(m, t);
  drawPlayer(t);
  drawFx();
  drawBanner();
}

/* ---------- loop ---------- */
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
  if (document.hidden) return;
  if (game && game.state !== 'over') {
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    updateCamera(dt); updateHUD();
  }
  draw();
}

/* ---------- start ---------- */
function start() {
  const name = pName.value.trim();
  if (!name) { pName.classList.remove('bad'); void pName.offsetWidth; pName.classList.add('bad'); pName.focus(); return; }
  store.set('borregos_player_name', name);
  unlockAudio();
  game = newGame(name); hud.c = hud.l = hud.s = hud.t = hud.v = -1;
  keys.left = keys.right = keys.jump = false; jumpEdge = false; acc = 0;
  snapCamera(); updateHUD();
  panel.classList.add('hide'); if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
pPlay.addEventListener('click', start);
pName.addEventListener('input', () => pName.classList.remove('bad'));

// attract mode behind the menu: the level, quiet, at the start
resize();
game = newGame(''); game.state = 'menu'; snapCamera();
requestAnimationFrame(frame);
window.__bros = { get game() { return game; }, keys, setKey, start, cam, goLevel: (i) => { loadLevel(game, i); snapCamera(); } };
})();
</script>
